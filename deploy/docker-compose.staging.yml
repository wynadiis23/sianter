services:
  backend:
    image: ghcr.io/wynadiis23/sianter-backend:staging
    container_name: sianter-backend-staging
    restart: unless-stopped
    env_file: .env.staging
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/wynadiis23/sianter-frontend:staging
    container_name: sianter-frontend-staging
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - infra-network

networks:
  infra-network:
    external: true
